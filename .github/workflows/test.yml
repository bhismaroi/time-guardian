name: Test

# The attendance parsers silently dropped data twice before (a date format
# change made every fingerprint row unreadable, and no test caught it).
# Running the suite on every push and pull request keeps that class of
# regression out of the deploy branch.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
